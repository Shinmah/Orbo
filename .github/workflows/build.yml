name: Tests et build Windows (.exe)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (données, types, unitaires, bout en bout)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validation des données
        run: npm run data:validate
      - name: Vérification des types
        run: npm run check
      - name: Tests unitaires
        run: npm test
      - name: Navigateur pour les tests de bout en bout
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm run test:e2e

  windows:
    name: Appli Windows (.exe)
    needs: test
    runs-on: windows-latest
    env:
      # Chaque push sur la branche principale publie une nouvelle version (Release GitHub),
      # que l'appli détecte via son bouton « Mettre à jour ».
      PUBLISH: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Numéro de version (1.0.<numéro du build>)
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version
      - name: Construction de l'installateur et de la version portable
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Orbo-Windows-${{ env.VERSION }}
          path: |
            release/Orbo-Setup.exe
            release/Orbo-portable.exe
          if-no-files-found: error
      - name: Notes de version (message du commit, sans les mentions techniques)
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: printf '%s\n' "$MESSAGE" | grep -v -E '^(Co-Authored-By|Claude-Session):' > release-notes.md
      - name: Publication de la version
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Orbo ${{ env.VERSION }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: |
            release/Orbo-Setup.exe
            release/Orbo-portable.exe
